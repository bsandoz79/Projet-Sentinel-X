# SENTINEL-X : docker compose up -d --build
# 1re fois : bash securiser_mqtt.sh puis bash securiser_dashboard.sh
# Les mots de passe sont dans .env (jamais versionné), voir .env.example
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/secrets:/mosquitto/secrets:ro     # passwd + acl générés par securiser_mqtt.sh
      - mosquitto-data:/mosquitto/data

  api:
    build: ./api
    restart: unless-stopped
    network_mode: host            # joint Mosquitto sur localhost:1883, qu'il soit en Docker ou installé sur le Pi
    environment:
      API_HOST: ${API_HOST:-127.0.0.1}        # API joignable seulement depuis le Pi (via le dashboard sécurisé)
      MQTT_HOST: localhost
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_API_USER:-}           # compte « api » : lecture seule (voir mosquitto/acl)
      MQTT_PASS: ${MQTT_API_PASS:-}
    devices:
      - /dev/video0:/dev/video0   # webcam USB (enlever ces 2 lignes si pas de webcam)
    volumes:
      - api-data:/data

  dashboard:
    # nginx : sert le dashboard (construit sur le PC, copié dans DASHBOARD_DIST)
    # + mot de passe + relais vers l'API. Identifiants : ./securiser_dashboard.sh
    image: nginx:alpine
    container_name: dashboard
    restart: unless-stopped
    network_mode: host            # écoute sur 8080, joint l'API sur 127.0.0.1:8000
    volumes:
      - ${DASHBOARD_DIST:-./dashboard/dist}:/usr/share/nginx/html:ro
      - ./nginx/sentinel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/secrets:/etc/nginx/secrets:ro

volumes:
  mosquitto-data:
  api-data:
