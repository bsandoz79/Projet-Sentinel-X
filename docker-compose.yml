# SENTINEL-X : docker compose up -d --build
# 1re fois (ou pour changer les mots de passe MQTT) : ./securiser_mqtt.sh
# Les mots de passe sont dans .env (jamais versionné), voir .env.example
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/secrets:/mosquitto/secrets:ro     # passwd + acl générés par securiser_mqtt.sh
      - mosquitto-data:/mosquitto/data

  api:
    build: ./api
    restart: unless-stopped
    network_mode: host            # joint Mosquitto sur localhost:1883, qu'il soit en Docker ou installé sur le Pi
    environment:
      MQTT_HOST: localhost
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_API_USER:-}           # compte « api » : lecture seule (voir mosquitto/acl)
      MQTT_PASS: ${MQTT_API_PASS:-}
    devices:
      - /dev/video0:/dev/video0   # webcam USB (enlever ces 2 lignes si pas de webcam)
    volumes:
      - api-data:/data

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: ${API_URL:-http://sentinel.local:8000}
    restart: unless-stopped
    ports: ["8080:80"]

volumes:
  mosquitto-data:
  api-data:
