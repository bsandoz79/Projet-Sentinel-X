# SENTINEL-X · porte d'entrée unique du dashboard (port 8080)
# - mot de passe obligatoire (HTTP Basic Auth) pour TOUT : pages, API, caméra
# - l'API (port 8000) n'écoute plus que sur le Pi lui-même : on ne peut la joindre qu'en passant ici
# - identifiants créés par ./securiser_dashboard.sh (fichier nginx/secrets/htpasswd, jamais versionné)
limit_req_zone $binary_remote_addr zone=sentinel:10m rate=30r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;                       # ne pas afficher la version de nginx

    auth_basic           "Sentinel-X";
    auth_basic_user_file /etc/nginx/secrets/htpasswd;

    # en-têtes de sécurité
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # l'API et la caméra passent par ici (même adresse, même mot de passe)
    location /api/ {
        limit_req zone=sentinel burst=300 nodelay;     # limite les rafales (ex. force brute)
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;                            # flux vidéo MJPEG en direct
        proxy_read_timeout 1h;
    }

    # la doc Swagger de l'API n'est pas exposée
    location ~ ^/(docs|redoc|openapi.json) { return 404; }
}
