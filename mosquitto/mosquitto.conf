# SENTINEL-X · broker MQTT sécurisé
# - plus de connexion anonyme : chaque programme a son compte
# - chaque compte n'a accès qu'à ses topics (fichier acl)
# Les mots de passe sont générés par ./securiser_mqtt.sh (jamais envoyés sur GitHub)
listener 1883
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

persistence true
persistence_location /mosquitto/data/

# Journal du broker : connexions refusées visibles avec « docker logs mosquitto »
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
